services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_DB: yoshkarola_tourism
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.6
    restart: unless-stopped
    network_mode: host
    environment:
      - MEILI_ENV=development
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/YoshkarOla.API
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=localhost;Port=5432;Database=yoshkarola_tourism;Username=postgres;Password=postgres
      - AllowedCorsOrigins__0=https://yolatur.ru
      - AllowedCorsOrigins__1=http://yolatur.ru
      - AllowedCorsOrigins__2=http://localhost:3000
      - AllowedCorsOrigins__3=http://localhost
      - MeiliSearch__Url=http://localhost:7700
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000
    restart: unless-stopped
    network_mode: host
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  pgdata:
  meilidata:
